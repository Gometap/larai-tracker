name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 (PHP 8.2 - 8.3) → Testbench 8, Pest 2
          - php: 8.2
            laravel: "10.*"
            testbench: "^8.0"
            pest: "^2.34"
            pest_laravel: "^2.3"
            composer_flags: "--no-security-blocking"
          - php: 8.3
            laravel: "10.*"
            testbench: "^8.0"
            pest: "^2.34"
            pest_laravel: "^2.3"
            composer_flags: "--no-security-blocking"

          # Laravel 11 (PHP 8.2 - 8.4) → Testbench 9, Pest 2
          - php: 8.2
            laravel: "11.*"
            testbench: "^9.0"
            pest: "^2.34"
            pest_laravel: "^2.3"
            composer_flags: "--no-security-blocking"
          - php: 8.3
            laravel: "11.*"
            testbench: "^9.0"
            pest: "^2.34"
            pest_laravel: "^2.3"
            composer_flags: "--no-security-blocking"
          - php: 8.4
            laravel: "11.*"
            testbench: "^9.0"
            pest: "^2.34"
            pest_laravel: "^2.3"
            composer_flags: "--no-security-blocking"

          # Laravel 12 (PHP 8.3 - 8.4) → Testbench 10, Pest 3
          - php: 8.3
            laravel: "12.*"
            testbench: "^10.0"
            pest: "^3.0"
            pest_laravel: "^3.0"
            composer_flags: ""
          - php: 8.4
            laravel: "12.*"
            testbench: "^10.0"
            pest: "^3.0"
            pest_laravel: "^3.0"
            composer_flags: ""

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline
          coverage: none

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.json') }}

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --prefer-stable \
            ${{ matrix.composer_flags }} \
            --with "laravel/framework:${{ matrix.laravel }}" \
            --with "orchestra/testbench:${{ matrix.testbench }}" \
            --with "pestphp/pest:${{ matrix.pest }}" \
            --with "pestphp/pest-plugin-laravel:${{ matrix.pest_laravel }}"

      - name: Execute tests
        run: vendor/bin/pest

      - name: Validate package metadata
        run: composer validate --strict --no-check-publish

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Audit supported dependencies
        if: matrix.laravel == '12.*'
        run: composer audit --locked

      # Laravel 10 and 11 are retained for compatibility testing after upstream
      # security support ended. Surface their advisories without hiding them or
      # preventing the compatibility suite from running.
      - name: Report legacy framework advisories
        if: matrix.laravel != '12.*'
        continue-on-error: true
        run: composer audit --locked
